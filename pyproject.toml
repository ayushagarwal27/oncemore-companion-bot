[project]
name = "oncemore"
version = "0.1.0"
description = "Memory and personality-consistency core loop for an AI companion"
requires-python = ">=3.12"

dependencies = [
    # backend server
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "python-multipart>=0.0.12",

    # agentic framework
    "langgraph>=0.6",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-community>=0.3",
    "langgraph-checkpoint-redis>=0.1.2",
    "langmem>=0.0.30",

    # llm
    "openai>=1.109",

    # postgres — psycopg3, async native. See README "Why psycopg3, not
    # SQLAlchemy" for the reasoning; not swapping to asyncpg/SQLAlchemy.
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",

    # redis — checkpoints + cache, confirmed in scope
    "redis>=5.2",

    # resilience + observability
    "tenacity>=9.0",
    "langsmith>=0.2",
    "structlog>=24.4",
]

[project.scripts]
companion = "cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
eval = [
    "openevals>=0.0.7",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout, not a single wrapped package - list top-level modules and
# subpackages explicitly rather than a `packages = [...]` entry, which
# expects one directory matching the project name (the previous layout,
# companion-core/companion/, was that; this one has no such directory).
include = [
    "*.py",
    "graph/**/*.py",
    "persona/**/*.py",
    "prompts/**/*.py",
    "storage/**/*.py",
    "scripts/**/*.py",
    "eval/**/*.py",
    "db/*.sql",
]

[tool.uv]
# eval group stays out of the default sync — the core loop must run without it
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
